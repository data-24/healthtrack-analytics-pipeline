version: 2

models:
  - name: stg_patients
    description: "Cleaned patient data — one row per patient. Deduplicated by patient_id."
    
    columns:
      - name: patient_id
        tests:
          - not_null
          - unique
      
      - name: date_of_birth
        tests:
          - not_null
      
      - name: gender
        tests:
          - dbt.accepted_values:
              arguments:
                values: ['Male', 'Female', 'Other']
      
      - name: state
        tests:
          - not_null